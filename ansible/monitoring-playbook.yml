---
- hosts: monitoring
  become: true

  vars:
    prometheus_version: "2.51.0"
    flask_app_ip: "{{ groups['servers'][0] }}"

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    # ── Prometheus ──────────────────────────────────────────
    - name: Create prometheus user
      user:
        name: prometheus
        shell: /sbin/nologin
        create_home: no

    - name: Create prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz

    - name: Extract prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Copy prometheus binaries
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: yes
        mode: '0755'
      loop:
        - prometheus
        - promtool

    - name: Write prometheus config
      copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node_exporter'
              static_configs:
                - targets: ['localhost:9100']

            - job_name: 'flask_app'
              static_configs:
                - targets: ['{{ flask_app_ip }}:5000']
              metrics_path: '/metrics'

    - name: Create prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes

    # ── Node Exporter ────────────────────────────────────────
    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz

    - name: Extract and install node_exporter
      shell: |
        tar xzf /tmp/node_exporter.tar.gz -C /tmp/
        cp /tmp/node_exporter-1.7.0.linux-amd64/node_exporter /usr/local/bin/
        chmod +x /usr/local/bin/node_exporter

    - name: Create node_exporter service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

    # ── Grafana ──────────────────────────────────────────────
    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - software-properties-common
          - wget
          - gnupg
        state: present

    - name: Add grafana GPG key
      shell: |
        wget -q -O - https://apt.grafana.com/gpg.key | \
        gpg --dearmor -o /usr/share/keyrings/grafana.gpg

    - name: Add grafana repo
      copy:
        dest: /etc/apt/sources.list.d/grafana.list
        content: |
          deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main

    - name: Install grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Start and enable grafana
      systemd:
        name: grafana-server
        state: started
        enabled: yes
        daemon_reload: yes
